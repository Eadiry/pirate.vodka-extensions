name: Nightly Dev Build

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  nightly:
    name: Nightly Dev Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dev Branch
        uses: actions/checkout@v4
        with:
          ref: "0.9/dev"
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Bump Nightly Version
        run: |
          VERSION="1.0.0-nightly.$(date +%y.%m.%d)"
          find src -name "pbconfig.ts" -exec sed -i "s/version: \"dev build\"/version: \"${VERSION}\"/" {} +
      - name: Clean Previous Bundle Output
        run: |
          rm -rf bundles
          rm -rf node_modules/.cache
      - name: Bundle Extensions
        run: npm run bundle
      - name: Deploy to GitHub Pages (dev)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: bundles
          destination_dir: dev
          cname: read.pirate.vodka
